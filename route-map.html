<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #map { width: 100%; height: 100%; background: #E2E2D8; }

  /* --- Popup Styling --- */
  .mapboxgl-popup { max-width: 320px !important; }
  .mapboxgl-popup-content {
    font-family: "Atkinson Hyperlegible Mono", monospace;
    padding: 0 !important;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    background-color: #E2E2D8 !important;
  }
  .mapboxgl-popup-close-button {
    width: 40px !important; height: 40px !important;
    font-size: 24px !important; line-height: 40px !important;
    display: flex !important; align-items: center; justify-content: center;
    color: #232320 !important; background: rgba(255, 255, 255, 0.4);
    border-radius: 50%; margin: 8px; z-index: 10; border: none; cursor: pointer;
  }
  .popup-image { width: 100%; height: 160px; object-fit: cover; display: block; }
  .popup-text-container { padding: 12px 16px 16px 16px; }
  .popup-title { margin: 0 0 4px 0; font-size: 14px; color: #232320; font-weight: 700; }
  .popup-desc { margin: 0; font-size: 11px; color: #232320; line-height: 1.4; }
  .popup-embed { padding: 0 16px 12px 16px; }
  .popup-embed iframe { border-radius: 8px; }

  .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip { border-bottom-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip { border-bottom-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip { border-top-color: #E2E2D8 !important; }
  .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip { border-top-color: #E2E2D8 !important; }
  .mapboxgl-popup-tip { border-top-color: #E2E2D8 !important; }

  /* Spot number markers */
  .spot-marker {
    width: 28px; height: 28px; border-radius: 50%;
    background: #232320; color: #E2E2D8;
    display: flex; align-items: center; justify-content: center;
    font-family: "Atkinson Hyperlegible Mono", monospace;
    font-size: 12px; font-weight: 700;
    border: 2px solid #E2E2D8;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease;
  }
  .spot-marker:hover { transform: scale(1.2); }

  /* Status messages */
  #status-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: "Atkinson Hyperlegible Mono", monospace;
    text-align: center; color: #232320; padding: 24px;
    display: none;
  }
  #status-msg h2 { font-size: 18px; margin-bottom: 8px; }
  #status-msg p { font-size: 13px; opacity: 0.7; }

  /* Geolocate button position */
  .mapboxgl-ctrl-bottom-right { bottom: 24px; right: 24px; }
</style>
</head>
<body>

<div id="map"></div>
<div id="status-msg">
  <h2 id="status-title"></h2>
  <p id="status-detail"></p>
</div>

<script>
// ============================================================
// CONFIGURATION — edit these values as needed
// ============================================================
const SHEET_ID = 'e/2PACX-1vRsZdbkvIn-2hKY4DvmnCW4keExHTeG2lt234TA7zQvPRATfG2fMcK6-R2d5PgThsrf3faGQuQua2P-';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/pub?output=csv';
const MAPBOX_TOKEN = 'pk.eyJ1IjoicG9zdGFsc291bmRzIiwiYSI6ImNtamM1cTR6YzBsbXUzZHB5NTRvbDV4aTIifQ.9KaoFRtAWzKkqeOpyA0SgA';
const MAPBOX_STYLE = 'mapbox://styles/postalsounds/cmmw7mtb7000x01sa0ifddo9w';

// ============================================================
// CSV PARSER — handles quoted fields, commas in quotes, etc.
// ============================================================
function parseCSV(text) {
  const lines = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      inQuotes = !inQuotes;
      current += ch;
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (current.trim()) lines.push(current);
      current = '';
      if (ch === '\r' && text[i + 1] === '\n') i++;
    } else {
      current += ch;
    }
  }
  if (current.trim()) lines.push(current);

  const rows = [];
  for (const line of lines) {
    const fields = [];
    let field = '';
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i + 1] === '"') { field += '"'; i++; }
        else { inQ = !inQ; }
      } else if (ch === ',' && !inQ) {
        fields.push(field); field = '';
      } else {
        field += ch;
      }
    }
    fields.push(field);
    rows.push(fields);
  }

  const headers = rows[0];
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const obj = {};
    for (let j = 0; j < headers.length; j++) {
      obj[headers[j].trim()] = (rows[i][j] || '').trim();
    }
    data.push(obj);
  }
  return data;
}

// ============================================================
// COORDINATE PARSER — handles Spanish decimal comma "40,4211"
// ============================================================
function parseCoord(val) {
  if (!val) return NaN;
  return parseFloat(val.replace(',', '.'));
}

// ============================================================
// STATUS MESSAGES
// ============================================================
function showStatus(title, detail) {
  document.getElementById('status-msg').style.display = 'block';
  document.getElementById('status-title').textContent = title;
  document.getElementById('status-detail').textContent = detail || '';
}
function hideStatus() {
  document.getElementById('status-msg').style.display = 'none';
}

// ============================================================
// MAIN
// ============================================================
async function init() {
  showStatus('Cargando datos...');

  const params = new URLSearchParams(window.location.search);
  const routeParam = params.get('route');

  // 1. Fetch CSV from published Google Sheet
  let csvText;
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    csvText = await res.text();
  } catch (err) {
    showStatus('Error cargando datos', 'No se pudo acceder a la hoja de cálculo. Verifica que esté publicada en la web (Archivo → Compartir → Publicar en la web → CSV).');
    console.error('Sheet fetch error:', err);
    return;
  }

  // 2. Parse CSV
  const rows = parseCSV(csvText);
  if (!rows.length) {
    showStatus('Sin datos', 'La hoja de cálculo está vacía.');
    return;
  }

  // 3. Group rows by route name
  const routesMap = {};
  for (const row of rows) {
    const rName = (row.route || '').trim();
    if (!rName) continue;

    const lat = parseCoord(row.latitude);
    const lng = parseCoord(row.longitude);
    if (isNaN(lat) || isNaN(lng)) continue;

    if (!routesMap[rName]) {
      routesMap[rName] = { description: '', spots: [] };
    }

    const desc = (row['Descripcion de ruta'] || '').trim();
    if (desc && !routesMap[rName].description) {
      routesMap[rName].description = desc;
    }

    routesMap[rName].spots.push({
      lat, lng,
      id: row.ID || '',
      name: row.name || 'Sin nombre',
      description: row.description || '',
      url: row.url || '',
      embed: row.embed || ''
    });
  }

  // 4. Sort spots by ID number within each route
  for (const key of Object.keys(routesMap)) {
    routesMap[key].spots.sort((a, b) => {
      const aNum = a.id.includes('.') ? parseFloat(a.id.split('.')[1]) : 0;
      const bNum = b.id.includes('.') ? parseFloat(b.id.split('.')[1]) : 0;
      return aNum - bNum;
    });
  }

  // 5. Resolve which route to show
  const allRouteNames = Object.keys(routesMap);
  let resolvedRoute = null;

  if (routeParam) {
    const lookup = routeParam.toLowerCase().trim();
    for (const name of allRouteNames) {
      if (name.toLowerCase().trim() === lookup) {
        resolvedRoute = name;
        break;
      }
    }
    if (!resolvedRoute) {
      showStatus('Ruta no encontrada', '"' + routeParam + '" no existe. Disponibles: ' + allRouteNames.join(', '));
      return;
    }
  } else {
    resolvedRoute = allRouteNames[0];
  }

  if (!resolvedRoute || !routesMap[resolvedRoute].spots.length) {
    showStatus('Sin rutas', 'No se encontraron rutas con datos válidos.');
    return;
  }

  hideStatus();
  const spots = routesMap[resolvedRoute].spots;

  // ============================================================
  // INITIALIZE MAP
  // ============================================================
  mapboxgl.accessToken = MAPBOX_TOKEN;

  const map = new mapboxgl.Map({
    container: 'map',
    style: MAPBOX_STYLE,
    center: [spots[0].lng, spots[0].lat],
    zoom: 14,
    attributionControl: false
  });

  map.addControl(new mapboxgl.AttributionControl({ compact: true }));

  map.on('load', function () {

    // Fit bounds to all spots
    const bounds = new mapboxgl.LngLatBounds();
    spots.forEach(s => bounds.extend([s.lng, s.lat]));
    map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });

    // Numbered markers + popups
    spots.forEach((spot, index) => {
      const el = document.createElement('div');
      el.className = 'spot-marker';
      el.textContent = index + 1;

      new mapboxgl.Marker({ element: el })
        .setLngLat([spot.lng, spot.lat])
        .addTo(map);

      el.addEventListener('click', function (e) {
        e.stopPropagation();
        document.querySelectorAll('.mapboxgl-popup').forEach(p => p.remove());

        let html = '';
        if (spot.url) {
          html += '<img src="' + spot.url + '" class="popup-image" onerror="this.style.display=\'none\'">';
        }
        html += '<div class="popup-text-container">';
        html += '<h3 class="popup-title">' + (index + 1) + '. ' + spot.name + '</h3>';
        html += '<p class="popup-desc">' + spot.description + '</p>';
        html += '</div>';
        if (spot.embed) {
          html += '<div class="popup-embed">' + spot.embed + '</div>';
        }

        new mapboxgl.Popup({ offset: 18, maxWidth: '320px' })
          .setLngLat([spot.lng, spot.lat])
          .setHTML(html)
          .addTo(map);
      });
    });

    // Route line — straight lines first, then upgrade to walking directions
    const straightLine = {
      type: 'LineString',
      coordinates: spots.map(s => [s.lng, s.lat])
    };

    map.addSource('walking-route', {
      type: 'geojson',
      data: { type: 'Feature', properties: {}, geometry: straightLine }
    });
    map.addLayer({
      id: 'walking-route-line',
      type: 'line',
      source: 'walking-route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: {
        'line-color': '#BFEF2B',
        'line-width': 5,
        'line-opacity': 1,
        'line-emissive-strength': 1
      }
    });

    // Fetch walking directions to upgrade the line
    const coords = spots.map(s => s.lng + ',' + s.lat).join(';');
    const dirUrl = 'https://api.mapbox.com/directions/v5/mapbox/walking/'
      + coords + '?geometries=geojson&overview=full&access_token=' + MAPBOX_TOKEN;

    fetch(dirUrl)
      .then(r => r.json())
      .then(data => {
        if (data.routes && data.routes.length > 0) {
          const src = map.getSource('walking-route');
          if (src) {
            src.setData({
              type: 'Feature', properties: {},
              geometry: data.routes[0].geometry
            });
          }
        }
      })
      .catch(err => console.warn('Walking directions unavailable:', err));

    // Controls — geolocate only, bottom-right with 24px margin
    map.addControl(new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }), 'bottom-right');

    map.resize();
  });

  window.addEventListener('resize', () => map && map.resize());
  setTimeout(() => map && map.resize(), 500);
}

init();
</script>
</body>
</html>
