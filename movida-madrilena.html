<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #map { width: 100%; height: 100%; background: #E2E2D8; }

  /* --- Popup Styling (matching general map) --- */
  .mapboxgl-popup { max-width: 320px !important; }
  .mapboxgl-popup-content {
    font-family: "Atkinson Hyperlegible Mono", monospace;
    padding: 0 !important;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    background-color: #E2E2D8 !important;
  }
  .mapboxgl-popup-close-button {
    width: 40px !important; height: 40px !important;
    font-size: 24px !important; line-height: 40px !important;
    display: flex !important; align-items: center; justify-content: center;
    color: #232320 !important; background: rgba(255, 255, 255, 0.4);
    border-radius: 50%; margin: 8px; z-index: 10; border: none; cursor: pointer;
  }
  .popup-image { width: 100%; height: 160px; object-fit: cover; display: block; }
  .popup-text-container { padding: 12px 16px 16px 16px; }
  .popup-title { margin: 0 0 4px 0; font-size: 14px; color: #232320; font-weight: 700; }
  .popup-desc { margin: 0; font-size: 11px; color: #232320; line-height: 1.4; }
  .popup-badge {
    display: inline-block; margin-top: 8px; padding: 2px 8px;
    font-size: 10px; font-weight: 700; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .popup-badge.free { background: #4CAF50; color: #fff; }
  .popup-badge.premium { background: #232320; color: #E2E2D8; }
  .popup-embed { padding: 0 16px 12px 16px; }
  .popup-embed iframe { border-radius: 8px; }

  .mapboxgl-popup-anchor-top .mapboxgl-popup-tip { border-bottom-color: #E2E2D8; }
  .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip { border-top-color: #E2E2D8; }
  .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: #E2E2D8; }
  .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: #E2E2D8; }

  /* Spot number markers */
  .spot-marker {
    width: 28px; height: 28px; border-radius: 50%;
    background: #232320; color: #E2E2D8;
    display: flex; align-items: center; justify-content: center;
    font-family: "Atkinson Hyperlegible Mono", monospace;
    font-size: 12px; font-weight: 700;
    border: 2px solid #E2E2D8;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease;
  }
  .spot-marker:hover { transform: scale(1.2); }

  /* Error state */
  #error-msg {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-family: "Atkinson Hyperlegible Mono", monospace;
    text-align: center; color: #232320; padding: 24px;
    display: none;
  }
  #error-msg h2 { font-size: 18px; margin-bottom: 8px; }
  #error-msg p { font-size: 13px; opacity: 0.7; }
</style>
</head>
<body>

<div id="map"></div>
<div id="error-msg">
  <h2>Ruta no encontrada</h2>
  <p id="error-detail"></p>
</div>

<script>
// ============================================================
// ROUTE DATA (embedded from CSV — swap to Google Sheets later)

const ROUTES_DATA = {

      {"lat":40.4211559428525,"lng":-3.71749991834012,"id":"R1.1","name":"Placa homenaje Casa Paco de Lucia","description":"Placa conmemorativa en la casa donde vivió el maestro Paco de Lucía durante su estancia madrileña. Un recordatorio de que el genio de Algeciras hizo de Madrid su hogar artístico durante décadas.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770659021/1PlacaHomenajePacodeLucia004_dum3bt.jpg","type":"Free","embed":""},

      {"lat":40.4096942176676,"lng":-3.71240627416107,"id":"R1.5","name":"Bodega del Aguila","description":"Bar tradicional reconvertido en espacio de conciertos. La Bodega del Águila mantiene su estética castiza mientras programa flamenco, copla y música española fusionada con sonidos contemporáneos.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770672233/IMG_0818_n5d1rn.heic","type":"Free","embed":""},

      {"lat":40.4264193452818,"lng":-3.70180418950398,"id":"R2.3","name":"Madrid me mata - museo/bar","description":"Museo y bar dedicado a la movida madrileña. Sus paredes exhiben fotografías, discos y recuerdos de Alaska, Almodóvar y toda la explosión cultural de los 80.","url":"","type":"Premium","embed":""},
      {"lat":40.4271315,"lng":-3.7029483,"id":"R2.4","name":"Tupperware","description":"Discoteca mítica que sobrevive desde los 80. Música alternativa indie y rock en pleno Malasaña.","url":"","type":"Premium","embed":""},
      {"lat":40.42697175,"lng":-3.70407149,"id":"R2.5","name":"Apocalipsis en Malasaña - Andrés Calamaro","description":"Historia del músico Argentino en Madrid. Malasaña como epicentro creativo de los 80.","url":"","type":"Premium","embed":""},
      {"lat":40.43315767,"lng":-3.70434013,"id":"R2.6","name":"Metro de Madrid informa - Ginebras","description":"Banda indie rock femenina formada en 2018. Nueva generación que conecta con la tradición de la Movida.","url":"","type":"Premium","embed":""},

      {"lat":40.38802083,"lng":-3.70180996,"id":"R2.8","name":"Sin Rencor - Cefe y los Gigantes","description":"Club en c/ Monederos donde actuaban grupos de pop y rock. Escena underground de los 80.","url":"","type":"Premium","embed":""},
      {"lat":40.436673,"lng":-3.70401793,"id":"R2.9","name":"Bravo Murillo - Rusos Blancos","description":"Canción que nombra una de las principales calles de Madrid. Estética urbana de los 80.","url":"","type":"Premium","embed":""},
      {"lat":40.425837,"lng":-3.7029577,"id":"R2.10","name":"Siroco","description":"Bar de copas con música alternativa desde los 80. DJ sets indie y electrónica que mantienen vivo el espíritu de la Movida.","url":"","type":"Premium","embed":""}
    ]
  },
  "Madrid Jazz": {
    "description": "Madrid tiene alma jazzística. Desde los años 60, la ciudad acogió clubes clandestinos durante el franquismo donde el jazz era sinónimo de libertad y resistencia.",
    "spots": [
      {"lat":40.4353700634282,"lng":-3.68490706086591,"id":"R3.1","name":"Whisky Jazz","description":"Club de J-P. Bourbon que funcionó desde mediados de los 60. Pat Metheny tocó allí espontáneamente cogiendo una Gibson aparcada. Cerró tras crisis del 93 e incendio.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770574498/bbst_dkuky4.jpg","type":"Premium","embed":""},
      {"lat":40.4126469914403,"lng":-3.6958422588173,"id":"R3.2","name":"Jazz Bar","description":"Sala intimista dedicada al jazz de calidad. Con iluminación tenue y acústica cuidada, es el templo del jazz contemporáneo.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1769244600/Jazz_Bar_bcw85j.jpg","type":"Premium","embed":""},
      {"lat":40.4141978950634,"lng":-3.70182406921834,"id":"R3.3","name":"Yesterdays - Tete Montoliu / Café Central","description":"Tete Montoliu salvó el Café Central del cierre en los 80. El pianista catalán viajó desde Barcelona para tocar diariamente durante 5 semanas.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770567197/tete-montoliu_45_420x210_rlk5ku.jpg","type":"Premium","embed":""},
      {"lat":40.431118,"lng":-3.7009577,"id":"R3.4","name":"Sala Clamores","description":"Veterana sala de jazz y blues desde 1981. Templo del jazz madrileño con programación diaria de calidad.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770653201/judith-hill-en-concierto_crlafl.jpg","type":"Premium","embed":""},
      {"lat":40.42053,"lng":-3.709059,"id":"R3.5","name":"Sun Records","description":"Tienda de discos de vinilo con ediciones especiales y sellos independientes. Destaca por sección de jazz, soul y funk.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770656457/manuel-sun-records_zpnhj7.jpg","type":"Premium","embed":""},
      {"lat":40.4098852,"lng":-3.7010636,"id":"R3.6","name":"Bajo El Volcán","description":"Librería y tienda de discos especializada en música experimental, jazz y world music.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770656382/elvolcan_bev3ex.jpg","type":"Premium","embed":""},
      {"lat":40.4108974601248,"lng":-3.69957471534292,"id":"R3.7","name":"El Despertar","description":"Fundado en 1981 en plena Transición española. Uno de los bastiones supervivientes del jazz madrileño con 40+ años de historia.","url":"https://res.cloudinary.com/dessz21gt/image/upload/v1770638934/Cafe-el-Despertar-Mdrid-5-A_he5p27.jpg","type":"Premium","embed":""},
      {"lat":40.4126469914403,"lng":-3.6958422588173,"id":"R3.8","name":"Jazz Bar","description":"Sala intimista dedicada al jazz de calidad. Con iluminación tenue y acústica cuidada.","url":"","type":"Premium","embed":""},
      {"lat":40.4214878,"lng":-3.6894872,"id":"R3.9","name":"Recoletos Jazz","description":"Club de jazz en el barrio de Salamanca. Conciertos de jazz de alta calidad en un ambiente elegante y sofisticado.","url":"","type":"Premium","embed":""}
    ]
  },
  "La Zarzuela de Madrid": {
    "description": "La zarzuela es el teatro musical español por excelencia, nacido en el siglo XVII pero consolidado en el Madrid del XIX.",
    "spots": [
      {"lat":40.4172956597,"lng":-3.6969152014,"id":"R4.1","name":"Teatro de la Zarzuela","description":"El templo de la zarzuela desde 1856. Sede de la Compañía Nacional de Zarzuela.","url":"","type":"Premium","embed":""},
      {"lat":40.4191043393,"lng":-3.6972927412,"id":"R4.2","name":"Gran Vía Chotis","description":"\"La Gran Vía\" es un chotis madrileño compuesto en 1886 por Federico Chueca para la zarzuela del mismo nombre.","url":"","type":"Premium","embed":""},
      {"lat":40.4154601985,"lng":-3.7103261994,"id":"R4.3","name":"Placa de Federico Chueca","description":"Placa conmemorativa dedicada a Federico Chueca, compositor de zarzuelas y máximo representante del género chico.","url":"","type":"Premium","embed":""},
      {"lat":40.4110493932,"lng":-3.6810807588,"id":"R4.4","name":"Monumento a Federico Chueca","description":"Escultura dedicada al compositor Federico Chueca en espacio público madrileño.","url":"","type":"Premium","embed":""},
      {"lat":40.4092860416,"lng":-3.6943931625,"id":"R4.5","name":"Museo del Real Conservatorio Superior de Música","description":"Museo que alberga instrumentos históricos y documentos de la historia musical española. Fundado en 1830.","url":"","type":"Premium","embed":""},
      {"lat":40.4140597089,"lng":-3.7035647474,"id":"R4.6","name":"Teatro Calderón","description":"Teatro histórico que programa zarzuela, opereta y musicales. Inaugurado en 1917.","url":"","type":"Premium","embed":""},
      {"lat":40.3905747841,"lng":-3.7433319474,"id":"R4.7","name":"Musical Princesa","description":"Tienda de instrumentos y partituras junto a Gran Vía. Veterana del barrio.","url":"","type":"Premium","embed":""},
      {"lat":40.4117313924,"lng":-3.6990591762,"id":"R4.8","name":"Cine Doré - Filmoteca Española","description":"La Filmoteca conserva grabaciones históricas de zarzuelas filmadas desde los años 30.","url":"","type":"Premium","embed":""}
    ]
  }
};

// ============================================================
// URL PARAMETER HANDLING
// ============================================================
const params = new URLSearchParams(window.location.search);
const routeName = params.get('route');

// Build a lookup map (case-insensitive, trimmed)
const routeLookup = {};
for (const key of Object.keys(ROUTES_DATA)) {
  routeLookup[key.toLowerCase().trim()] = key;
}

// Resolve the route
let resolvedRoute = null;
if (routeName) {
  const lookup = routeName.toLowerCase().trim();
  if (routeLookup[lookup]) {
    resolvedRoute = routeLookup[lookup];
  }
}

// Fallback: if no route param or not found, default to first available route
if (!resolvedRoute) {
  const allRoutes = Object.keys(ROUTES_DATA);
  if (routeName) {
    // Bad route name — show error
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-detail').textContent = 'Ruta "' + routeName + '" no encontrada. Rutas disponibles: ' + allRoutes.join(', ');
  } else {
    // No param at all — just show first route as default
    resolvedRoute = allRoutes[0];
  }
}

// ============================================================
// MAP INITIALIZATION
// ============================================================
if (resolvedRoute) {
  const routeData = ROUTES_DATA[resolvedRoute];
  const spots = routeData.spots;

  mapboxgl.accessToken = 'pk.eyJ1IjoicG9zdGFsc291bmRzIiwiYSI6ImNtbXc5b3FvNDF5bjQycHM4aWY1NzI0aGkifQ.m-nG7WS7hk1Sa_TrPg_SZw';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/postalsounds/cmmw7mtb7000x01sa0ifddo9w',
    center: [spots[0].lng, spots[0].lat],
    zoom: 14,
    attributionControl: false
  });

  // Add compact attribution
  map.addControl(new mapboxgl.AttributionControl({ compact: true }));

  map.on('load', function () {

    // --- FIT BOUNDS to show all spots ---
    const bounds = new mapboxgl.LngLatBounds();
    spots.forEach(s => bounds.extend([s.lng, s.lat]));
    map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });

    // --- ADD NUMBERED MARKERS ---
    const markers = [];
    spots.forEach((spot, index) => {
      const el = document.createElement('div');
      el.className = 'spot-marker';
      el.textContent = index + 1;

      const marker = new mapboxgl.Marker({ element: el })
        .setLngLat([spot.lng, spot.lat])
        .addTo(map);

      // Click handler for popup
      el.addEventListener('click', function (e) {
        e.stopPropagation();

        // Close any existing popups
        const existing = document.querySelectorAll('.mapboxgl-popup');
        existing.forEach(p => p.remove());

        let popupHTML = '';
        if (spot.url) {
          popupHTML += '<img src="' + spot.url + '" class="popup-image" onerror="this.style.display=\'none\'">';
        }
        popupHTML += '<div class="popup-text-container">';
        popupHTML += '<h3 class="popup-title">' + (index + 1) + '. ' + spot.name + '</h3>';
        popupHTML += '<p class="popup-desc">' + spot.description + '</p>';
        if (spot.type) {
          const badgeClass = spot.type.toLowerCase() === 'free' ? 'free' : 'premium';
          popupHTML += '<span class="popup-badge ' + badgeClass + '">' + spot.type + '</span>';
        }
        popupHTML += '</div>';
        if (spot.embed) {
          popupHTML += '<div class="popup-embed">' + spot.embed + '</div>';
        }

        new mapboxgl.Popup({ offset: 18, maxWidth: '320px' })
          .setLngLat([spot.lng, spot.lat])
          .setHTML(popupHTML)
          .addTo(map);
      });

      markers.push(marker);
    });

    // --- DRAW ROUTE LINE ---
    // Helper: add a line to the map from a geometry
    function drawRouteLine(geometry) {
      try {
        map.addSource('walking-route', {
          type: 'geojson',
          data: { type: 'Feature', properties: {}, geometry: geometry }
        });
        map.addLayer({
          id: 'walking-route-line',
          type: 'line',
          source: 'walking-route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: {
            'line-color': '#BFEF2B',
            'line-width': 5,
            'line-opacity': 1,
            'line-emissive-strength': 1
          }
        });
        console.log('Route line drawn successfully with', geometry.coordinates.length, 'coordinates');
      } catch (err) {
        console.error('Error drawing route line:', err);
      }
    }

    // Straight-line fallback geometry
    const straightLine = {
      type: 'LineString',
      coordinates: spots.map(s => [s.lng, s.lat])
    };
    console.log('Drawing straight line with coords:', JSON.stringify(straightLine.coordinates.slice(0, 3)));

    // Always draw the straight-line fallback immediately
    drawRouteLine(straightLine);

    // Then attempt to upgrade to walking directions
    const coordinates = spots.map(s => s.lng + ',' + s.lat).join(';');
    const directionsUrl = 'https://api.mapbox.com/directions/v5/mapbox/walking/'
      + coordinates
      + '?geometries=geojson&overview=full&access_token=' + mapboxgl.accessToken;

    fetch(directionsUrl)
      .then(res => res.json())
      .then(data => {
        console.log('Directions API response:', data.code, data.routes ? data.routes.length + ' routes' : 'no routes');
        if (data.routes && data.routes.length > 0) {
          const src = map.getSource('walking-route');
          if (src) {
            src.setData({
              type: 'Feature',
              properties: {},
              geometry: data.routes[0].geometry
            });
            console.log('Upgraded to walking directions');
          }
        }
      })
      .catch(err => {
        console.warn('Walking directions unavailable:', err);
      });

    // --- GEOLOCATE CONTROL ---
    map.addControl(new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    }));

    // --- NAVIGATION CONTROL ---
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    // Ensure renderer is awake
    map.resize();
  });

  // Handle iframe resize
  window.addEventListener('resize', function () {
    if (map) map.resize();
  });

  // Also resize after a short delay (helps with Framer embed timing)
  setTimeout(function () {
    if (map) map.resize();
  }, 500);
}
</script>
</body>
</html>
